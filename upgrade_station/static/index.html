<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>女娲升级台</title>
<style>
  :root {
    --bg: #0a0e17;
    --bg-gradient: linear-gradient(180deg, #0a0e17 0%, #0d1321 50%, #0a0e17 100%);
    --panel: #111827;
    --panel-hover: #1a2332;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-dim: #64748b;
    --accent: #3b82f6;
    --accent-hover: #60a5fa;
    --accent-glow: rgba(59, 130, 246, 0.3);
    --green: #10b981;
    --red: #ef4444;
    --yellow: #f59e0b;
    --purple: #8b5cf6;
    --radius: 12px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-gradient);
    color: var(--text);
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* 左侧边栏 */
  .sidebar {
    width: 280px;
    min-width: 280px;
    background: rgba(17, 24, 39, 0.8);
    backdrop-filter: blur(12px);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  .sidebar-header {
    padding: 24px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(59, 130, 246, 0.05) 0%, transparent 100%);
  }
  .sidebar-header h1 {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 30px var(--accent-glow);
  }
  .sidebar-header p {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
  }
  .skill-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .skill-item {
    padding: 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.2s ease;
    margin-bottom: 6px;
    border: 1px solid transparent;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: rgba(30, 41, 59, 0.3);
  }
  .skill-item .skill-checkbox {
    margin-top: 3px;
    transform: scale(1.3);
    cursor: pointer;
    accent-color: var(--accent);
  }
  .skill-item .skill-content {
    flex: 1;
  }
  .skill-item:hover {
    background: var(--panel-hover);
    border-color: rgba(59, 130, 246, 0.2);
    transform: translateX(4px);
  }
  .skill-item.active {
    background: rgba(59, 130, 246, 0.12);
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .skill-item.selected {
    background: rgba(59, 130, 246, 0.08);
    border-color: rgba(59, 130, 246, 0.4);
  }
  .skill-item.active.selected {
    background: rgba(59, 130, 246, 0.15);
    border-color: var(--accent);
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .skill-item .name {
    font-size: 14px;
    font-weight: 600;
  }
  .skill-item .desc {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .skill-item .badges {
    margin-top: 6px;
    display: flex;
    gap: 6px;
  }
  .badge {
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 12px;
    background: rgba(59, 130, 246, 0.1);
    color: var(--accent);
  }
  .badge.warn {
    background: rgba(245, 158, 11, 0.15);
    color: var(--yellow);
  }
  .badge.success {
    background: rgba(16, 185, 129, 0.15);
    color: var(--green);
  }

  /* 主区域 */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .toolbar {
    padding: 18px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(17, 24, 39, 0.6);
    backdrop-filter: blur(12px);
  }
  .toolbar h2 {
    font-size: 17px;
    font-weight: 600;
    flex: 1;
    color: var(--text);
  }
  .content-area {
    flex: 1;
    overflow-y: auto;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  /* 卡片 */
  .card {
    background: rgba(17, 24, 39, 0.7);
    backdrop-filter: blur(12px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    transition: all 0.2s ease;
  }
  .card:hover {
    border-color: rgba(59, 130, 246, 0.3);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
  }
  .card h3 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h3::before {
    content: '';
    width: 4px;
    height: 16px;
    background: var(--accent);
    border-radius: 2px;
  }
  /* 按钮 */
  .btn {
    padding: 10px 22px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: rgba(30, 41, 59, 0.6);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.2s ease;
    white-space: nowrap;
  }
  .btn:hover {
    background: var(--panel-hover);
    border-color: rgba(59, 130, 246, 0.4);
    transform: translateY(-1px);
  }
  .btn:active {
    transform: translateY(0);
  }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), #2563eb);
    color: white;
    border-color: var(--accent);
    font-weight: 600;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .btn.primary:hover {
    background: linear-gradient(135deg, var(--accent-hover), #3b82f6);
    box-shadow: 0 6px 20px var(--accent-glow);
    transform: translateY(-2px);
  }
  .btn.danger {
    border-color: rgba(239, 68, 68, 0.4);
    color: var(--red);
    background: rgba(239, 68, 68, 0.05);
  }
  .btn.danger:hover {
    background: rgba(239, 68, 68, 0.12);
    border-color: var(--red);
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    transform: none !important;
  }

  /* 上传区 */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 36px;
    text-align: center;
    cursor: pointer;
    background: rgba(30, 41, 59, 0.3);
    transition: all 0.2s ease;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(59, 130, 246, 0.05);
  }
    transition: all 0.15s;
    color: var(--text-dim);
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(167,139,250,0.05);
    color: var(--text);
  }
  .dropzone input { display: none; }

  /* 输入框 */
  .input-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .input-row input, .input-row textarea {
    flex: 1;
    padding: 8px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
  }
  .input-row textarea {
    min-height: 80px;
    resize: vertical;
  }

  /* 进度步骤 */
  .steps {
    display: flex;
    gap: 0;
    align-items: center;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 13px;
    color: var(--text-dim);
    background: var(--bg);
    border: 1px solid var(--border);
  }
  .step.active {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(167,139,250,0.1);
  }
  .step.done {
    color: var(--green);
    border-color: var(--green);
    background: rgba(52,211,153,0.1);
  }
  .step-arrow {
    color: var(--text-dim);
    margin: 0 4px;
    font-size: 12px;
  }

  /* 日志 */
  .log {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 16px;
    font-family: 'Consolas', 'Monaco', monospace;
    font-size: 12px;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .log .ok { color: var(--green); }
  .log .warn { color: var(--yellow); }
  .log .error { color: var(--red); }

  /* 差异表格 */
  .diff-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .diff-table th {
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
  }
  .diff-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .diff-table .action-append { color: var(--green); }
  .diff-table .action-review { color: var(--yellow); }

  /* 提示词预览 */
  .prompt-preview {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 16px;
    font-size: 12px;
    max-height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
    font-family: 'Consolas', 'Monaco', monospace;
    line-height: 1.5;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 16px;
  }

  /* 弹窗 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 700px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .modal h3 {
    margin-bottom: 16px;
    font-size: 16px;
  }
  .modal-close {
    float: right;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 20px;
  }
</style>
</head>
<body>

<!-- 左侧边栏 -->
<div class="sidebar">
  <div class="sidebar-header">
    <h1>女娲升级台</h1>
    <p>Skill Upgrade Station v2.0</p>
  </div>
  <div class="skill-list" id="skillList">
    <div class="empty-state" style="padding:30px">
      <div class="icon">加载中...</div>
    </div>
  </div>
</div>

<!-- 主区域 -->
<div class="main">
  <div class="toolbar">
    <h2 id="pageTitle">选择一个技能</h2>
    <span id="actionButtons"></span>
    <span id="batchButton" style="margin-left:auto"></span>
  </div>
  <div class="content-area" id="contentArea">
    <div class="empty-state">
      <div class="icon">←</div>
      <p>从左侧选择一个已蒸馏的人物技能</p>
    </div>
  </div>
</div>

<!-- 弹窗容器 -->
<div id="modalContainer"></div>

<script>
const API = '';
let currentSkill = null;

let selectedSkills = [];

// ========== 加载技能列表 ==========
async function loadSkills() {
  const res = await fetch(`${API}/api/skills`);
  const data = await res.json();
  const list = document.getElementById('skillList');
  if (data.skills.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:30px"><div class="icon">空</div><p>暂无技能</p></div>';
    return;
  }
  list.innerHTML = data.skills.map(s => `
    <div class="skill-item ${currentSkill === s.name ? 'active' : ''} ${selectedSkills.includes(s.name) ? 'selected' : ''}">
      <input type="checkbox" class="skill-checkbox" ${selectedSkills.includes(s.name) ? 'checked' : ''} 
             onclick="toggleSkillSelect('${s.name}', event)" />
      <div class="skill-content" onclick="selectSkill('${s.name}')">
        <div class="name">${s.display_name}</div>
        <div class="desc">${s.description || '无描述'}</div>
        <div class="badges">
          <span class="badge">${s.research_files} 调研文件</span>
          ${s.staging_count > 0 ? `<span class="badge warn">${s.staging_count} 待处理</span>` : ''}
        </div>
      </div>
    </div>
  `).join('');
  updateBatchButtons();
}

function toggleSkillSelect(name, event) {
  event.stopPropagation();
  const idx = selectedSkills.indexOf(name);
  if (idx > -1) {
    selectedSkills.splice(idx, 1);
  } else {
    selectedSkills.push(name);
  }
  updateBatchButtons();
}

function updateBatchButtons() {
  const btn = document.getElementById('batchButton');
  if (selectedSkills.length > 0) {
    btn.innerHTML = `
      <button class="btn primary" onclick="batchCreateAiTasks()" style="margin-right:8px">
        批量生成AI任务 (${selectedSkills.length})
      </button>
      <button class="btn" onclick="batchSelectAll()">全选</button>
      <button class="btn" onclick="batchClear()">取消选择</button>
    `;
  } else {
    btn.innerHTML = '<button class="btn" onclick="batchSelectAll()">全选</button>';
  }
}

function batchSelectAll() {
  fetch(`${API}/api/skills`)
    .then(r => r.json())
    .then(data => {
      selectedSkills = data.skills.map(s => s.name);
      loadSkills();
    });
}

function batchClear() {
  selectedSkills = [];
  loadSkills();
}

async function batchCreateAiTasks() {
  if (selectedSkills.length === 0) return;
  const div = document.getElementById('aiTaskResult');
  div.innerHTML = `<span style="color:var(--accent)">正在为 ${selectedSkills.length} 个技能生成AI任务...</span>`;

  let success = 0, failed = 0;
  for (const name of selectedSkills) {
    const res = await fetch(`${API}/api/skills/${name}/ai-task`, { method: 'POST' });
    const data = await res.json();
    if (data.ok) success++;
    else failed++;
  }

  div.innerHTML = `<div class="ok">批量任务生成完成！成功: ${success}, 失败: ${failed}</div>`;
  div.innerHTML += `<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:var(--radius);font-size:13px">`;
  div.innerHTML += `<b>→ 请对 Trae AI 说:</b><br>`;
  div.innerHTML += `<code style="font-size:14px;color:var(--accent)">升级全部</code>`;
  div.innerHTML += `</div>`;
}

// ========== 选择技能 ==========
async function selectSkill(name) {
  currentSkill = name;
  await loadSkills();
  document.getElementById('pageTitle').textContent = name;
  document.getElementById('actionButtons').innerHTML = `
    <button class="btn danger" onclick="clearStaging()">清空暂存</button>
  `;
  renderSkillView();
}

// ========== 渲染技能视图 ==========
async function renderSkillView() {
  const area = document.getElementById('contentArea');
  area.innerHTML = renderWorkflow();
}

function renderWorkflow() {
  return `
    <!-- 步骤 1: 导入素材 -->
    <div class="card">
      <h3>1. 导入新素材</h3>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <div>拖拽文件到此处，或点击选择文件</div>
        <div style="font-size:11px;margin-top:4px">支持 .txt .md .json</div>
        <input type="file" id="fileInput" multiple accept=".txt,.md,.json" onchange="handleFileUpload(this.files)">
      </div>
      <div class="input-row">
        <input type="text" id="urlInput" placeholder="粘贴文章URL...">
        <button class="btn" onclick="ingestUrl()">导入URL</button>
      </div>
      <div class="input-row">
        <textarea id="textInput" placeholder="或直接粘贴文本内容..."></textarea>
        <button class="btn primary" onclick="ingestText()">导入文本</button>
      </div>
      <div id="ingestStatus" style="margin-top:8px;font-size:12px;color:var(--text-dim)"></div>
    </div>

    <!-- 步骤 2: 一键自动升级 -->
    <div class="card">
      <h3>2. 一键自动升级</h3>
      <p style="font-size:12px;color:var(--text-dim);margin-bottom:12px">自动搜索最新资料 → AI分析 → 更新技能，实现自我迭代</p>
      
      <!-- 升级选项 -->
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px">
        <label style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="optSearch" checked />
          <span style="font-size:13px">联网搜索最新资料</span>
        </label>
        <label style="display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="optUpload" checked />
          <span style="font-size:13px">使用已上传资料</span>
        </label>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn primary" onclick="autoUpgrade()" id="btnAutoUpgrade">
          ⚡ 一键自动升级
        </button>
        <button class="btn" onclick="createAiTask()">手动生成AI任务</button>
        <button class="btn" onclick="checkAiTask()">刷新任务状态</button>
        <button class="btn primary" onclick="applyAiResults()" id="btnApplyAi" disabled>应用AI结果</button>
      </div>
      <div id="aiTaskResult" style="margin-top:12px"></div>
    </div>
  `;
}

// ========== 拖拽上传 ==========
document.addEventListener('DOMContentLoaded', () => {
  loadSkills();
  const dz = document.getElementById('dropzone');
  if (dz) {
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
    dz.addEventListener('drop', e => {
      e.preventDefault();
      dz.classList.remove('dragover');
      handleFileUpload(e.dataTransfer.files);
    });
  }
});

async function handleFileUpload(files) {
  if (!currentSkill) return alert('请先选择技能');
  if (!files.length) return;
  const status = document.getElementById('ingestStatus');
  status.textContent = '上传中...';
  let count = 0;
  for (const f of files) {
    const form = new FormData();
    form.append('file', f);
    const res = await fetch(`${API}/api/skills/${currentSkill}/ingest`, { method: 'POST', body: form });
    const data = await res.json();
    count += data.ingested;
  }
  status.innerHTML = `<span class="ok">已导入 ${count} 个文件</span>`;
  await loadSkills();
}

async function ingestUrl() {
  if (!currentSkill) return alert('请先选择技能');
  const url = document.getElementById('urlInput').value.trim();
  if (!url) return alert('请输入URL');
  const form = new FormData();
  form.append('url', url);
  const res = await fetch(`${API}/api/skills/${currentSkill}/ingest`, { method: 'POST', body: form });
  const data = await res.json();
  document.getElementById('ingestStatus').innerHTML = `<span class="ok">已导入URL</span>`;
  document.getElementById('urlInput').value = '';
  await loadSkills();
}

async function ingestText() {
  if (!currentSkill) return alert('请先选择技能');
  const text = document.getElementById('textInput').value.trim();
  if (!text) return alert('请输入文本');
  const form = new FormData();
  form.append('text', text);
  const res = await fetch(`${API}/api/skills/${currentSkill}/ingest`, { method: 'POST', body: form });
  const data = await res.json();
  document.getElementById('ingestStatus').innerHTML = `<span class="ok">已导入文本</span>`;
  document.getElementById('textInput').value = '';
  await loadSkills();
}

// ========== AI 智能升级 ==========
async function createAiTask() {
  if (!currentSkill) return;
  const div = document.getElementById('aiTaskResult');
  div.innerHTML = '<span style="color:var(--accent)">正在生成AI任务...</span>';

  // 先确保有差异分析
  const res = await fetch(`${API}/api/skills/${currentSkill}/ai-task`, { method: 'POST' });
  const data = await res.json();
  if (!data.ok) {
    div.innerHTML = `<span class="error">${data.error}</span>`;
    return;
  }

  const t = data.task;
  let html = `<div class="ok">AI任务已生成！包含 ${t.task_count} 个子任务</div>`;
  html += `<div style="margin-top:8px;font-size:12px;color:var(--text-dim)">任务ID: ${t.task_ids.join(', ')}</div>`;
  html += `<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:var(--radius);font-size:13px">`;
  html += `<b>→ 请对 Trae AI 说:</b><br>`;
  html += `<code style="font-size:14px;color:var(--accent)">升级 ${currentSkill}</code>`;
  html += `</div>`;
  html += `<div style="margin-top:8px;font-size:11px;color:var(--text-dim)">Trae AI 处理完成后，点击「刷新任务状态」再点击「应用AI结果」</div>`;

  div.innerHTML = html;
  document.getElementById('btnApplyAi').disabled = true;
}

async function autoUpgrade() {
  if (!currentSkill) return;
  
  const searchEnabled = document.getElementById('optSearch')?.checked ?? true;
  const uploadEnabled = document.getElementById('optUpload')?.checked ?? true;
  
  if (!searchEnabled && !uploadEnabled) {
    alert('请至少选择一个升级来源');
    return;
  }

  const div = document.getElementById('aiTaskResult');
  const btn = document.getElementById('btnAutoUpgrade');
  
  btn.disabled = true;
  btn.innerHTML = '升级中...';
  div.innerHTML = '<div style="color:var(--accent)">🔄 正在执行一键自动升级...</div>';

  try {
    const data = {
      search: searchEnabled,
      useUploaded: uploadEnabled,
    };

    const res = await fetch(`${API}/api/skills/${currentSkill}/auto-upgrade`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });

    const result = await res.json();

    if (!result.ok) {
      let html = `<div class="error">升级失败</div>`;
      if (result.errors) {
        html += `<div style="margin-top:8px;font-size:12px;color:var(--text-dim)">错误详情:</div>`;
        for (const err of result.errors) {
          html += `<div style="font-size:12px;color:var(--red)">${err}</div>`;
        }
      }
      div.innerHTML = html;
      return;
    }

    let html = `<div class="ok">🎉 一键升级完成！</div>`;
    html += `<div style="margin-top:12px;font-size:13px">升级步骤:</div>`;
    html += `<ul style="margin-top:8px;font-size:12px;color:var(--text-dim);list-style:none;padding-left:0">`;
    for (const step of result.steps) {
      html += `<li>${step}</li>`;
    }
    html += `</ul>`;
    
    if (result.message) {
      html += `<div style="margin-top:12px;padding:12px;background:var(--bg);border-radius:var(--radius);font-size:13px">`;
      html += `<b>${result.message}</b>`;
      html += `</div>`;
    }

    div.innerHTML = html;
    
    // 刷新技能列表
    await loadSkills();
    
  } catch (error) {
    div.innerHTML = `<div class="error">升级失败: ${error.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.innerHTML = '⚡ 一键自动升级';
  }
}

async function checkAiTask() {
  if (!currentSkill) return;
  const div = document.getElementById('aiTaskResult');
  div.innerHTML = '检查中...';

  const res = await fetch(`${API}/api/skills/${currentSkill}/ai-task`);
  const data = await res.json();

  if (!data.ok) {
    div.innerHTML = `<span style="color:var(--text-dim)">暂无AI任务，请先点击「一键生成AI任务」</span>`;
    document.getElementById('btnApplyAi').disabled = true;
    return;
  }

  const s = data.status;
  let html = `<div style="font-size:13px">`;
  html += `<b>任务状态:</b> <span class="${s.status === 'completed' ? 'ok' : s.status === 'partial' ? 'warn' : ''}">${s.status}</span><br>`;
  html += `创建时间: ${s.created_at}<br>`;
  if (s.completed_at) html += `完成时间: ${s.completed_at}<br>`;
  html += `子任务: ${s.completed_count}/${s.task_count} 完成<br>`;
  html += `</div>`;

  if (s.status === 'completed' || s.status === 'partial') {
    document.getElementById('btnApplyAi').disabled = false;
    html += `<div class="ok" style="margin-top:8px">AI 处理完成，可以应用结果了！</div>`;
    html += `<div style="margin-top:8px;font-size:11px;color:var(--text-dim)">已处理: ${s.result_ids.join(', ')}</div>`;
  } else if (s.status === 'pending') {
    document.getElementById('btnApplyAi').disabled = true;
    html += `<div style="margin-top:8px;color:var(--yellow)">等待 AI 处理中...</div>`;
  } else if (s.status === 'applied') {
    document.getElementById('btnApplyAi').disabled = true;
    html += `<div class="ok" style="margin-top:8px">结果已应用，升级完成！</div>`;
  }

  div.innerHTML = html;
}

async function applyAiResults() {
  if (!currentSkill) return;
  if (!confirm('确认应用 AI 处理结果？将更新调研文件和SKILL.md。')) return;

  const div = document.getElementById('aiTaskResult');
  div.innerHTML = '应用中...';

  const res = await fetch(`${API}/api/skills/${currentSkill}/ai-task/apply`, { method: 'POST' });
  const data = await res.json();

  if (!data.ok) {
    div.innerHTML = `<span class="error">${data.error}</span>`;
    return;
  }

  let html = `<div class="ok">AI 升级完成！</div>`;
  html += `<div style="font-size:12px;margin-top:8px">备份: ${data.backup}</div>`;
  html += `<div style="font-size:12px;margin-top:4px">已应用 ${data.result_count} 个结果</div>`;
  for (const f of data.updated) {
    html += `<div style="font-size:12px;color:var(--text-dim)">更新: ${f}</div>`;
  }
  div.innerHTML = html;
  document.getElementById('btnApplyAi').disabled = true;
  await loadSkills();
}

// ========== 清理 ==========
async function clearStaging() {
  if (!currentSkill) return;
  if (!confirm('确认清空暂存区？')) return;
  await fetch(`${API}/api/skills/${currentSkill}/clear`, { method: 'POST' });
  await loadSkills();
  renderSkillView();
}

// ========== 工具函数 ==========
function showModal(title, content) {
  document.getElementById('modalContainer').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">x</button>
        <h3>${title}</h3>
        ${content}
      </div>
    </div>
  `;
}
function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalContainer').innerHTML = '';
}
function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
